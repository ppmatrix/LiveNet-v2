{
  "name": "livenetv2-dev09b-authoritytrial",
  "services": {
    "db": {
      "image": "postgres:16-alpine@sha256:f4610795587492cd4fb887c2dc3de301b813278bb6f616992061141b5f15ac36",
      "platform": "linux/amd64",
      "pull_policy": "never",
      "restart": "no",
      "environment": {
        "POSTGRES_DB": "dev09b_authority_trial",
        "POSTGRES_USER": "dev09b_authority_trial_admin",
        "POSTGRES_PASSWORD_FILE": "/run/secrets/authoritytrial_admin_password",
        "POSTGRES_INITDB_ARGS": "--auth-host=scram-sha-256 --auth-local=scram-sha-256 --encoding=UTF8 --locale=C --locale-provider=libc"
      },
      "command": [
        "postgres",
        "-c",
        "log_statement=none",
        "-c",
        "log_min_error_statement=panic",
        "-c",
        "log_parameter_max_length=0",
        "-c",
        "log_parameter_max_length_on_error=0",
        "-c",
        "log_min_messages=fatal",
        "-c",
        "log_error_verbosity=terse",
        "-c",
        "hba_file=/etc/postgresql/authoritytrial.pg_hba.conf"
      ],
      "secrets": [
        "authoritytrial_admin_password"
      ],
      "volumes": [
        "authoritytrial_data:/var/lib/postgresql/data",
        "./scripts/postgres/dev09b_authoritytrial.pg_hba.conf:/etc/postgresql/authoritytrial.pg_hba.conf:ro"
      ],
      "networks": [
        "backend"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "pg_isready",
          "-U",
          "dev09b_authority_trial_admin",
          "-d",
          "dev09b_authority_trial"
        ],
        "interval": "5s",
        "timeout": "5s",
        "retries": 12,
        "start_period": "10s"
      }
    }
  },
  "secrets": {
    "authoritytrial_admin_password": {
      "file": "${DEV09B_AUTHORITYTRIAL_STATE_DIR:?private absolute directory outside Git}/admin_password"
    }
  },
  "volumes": {
    "authoritytrial_data": {
      "name": "livenetv2-dev09b-authoritytrial_data"
    }
  },
  "networks": {
    "backend": {
      "name": "livenetv2-dev09b-authoritytrial_backend",
      "internal": true,
      "driver": "bridge"
    }
  }
}
