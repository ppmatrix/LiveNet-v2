services:
  backend:
    build:
      context: ./backend

    restart: unless-stopped

    environment:
      LIVENET_ENV: development
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_NAME: livenet
      DATABASE_USER: livenet
      DATABASE_PASSWORD_FILE: /run/secrets/db_password

    secrets:
      - db_password

    depends_on:
      db:
        condition: service_healthy

    networks:
      - backend
