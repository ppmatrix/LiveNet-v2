# M1.3C-IMP1A: static configuration only. Starting this project needs separate approval.
name: livenetv2-web-dev

services:
  web:
    image: caddy:2.11.7-alpine
    # Image acquisition/verification is a separate operational step.
    pull_policy: never
    restart: "no"
    command: [caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    ports:
      # Planning address: reconfirm IP ownership and port availability before starting.
      - target: 8443
        published: "8443"
        host_ip: 10.10.77.229
        protocol: tcp
    volumes:
      - type: bind
        source: ./frontend/dist
        target: /srv
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./infra/web-dev/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: caddy_data
        target: /data
        volume:
          nocopy: true
    tmpfs:
      - /config:rw,noexec,nosuid,size=16m
      - /tmp:rw,noexec,nosuid,size=16m
    networks:
      - web

volumes:
  caddy_data:
    name: livenetv2-web-dev_caddy_data

networks:
  web:
    name: livenetv2-web-dev_web
    driver: bridge
